<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>LibreTV · 手机遥控</title><link rel="icon" href="/icon.png?token=__TOKEN__"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16343c;background:#eef5f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #00889e;outline-offset:3px}main{max-width:600px;margin:auto;padding:24px 20px 230px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:15px}.brand strong{font-size:19px;letter-spacing:-.5px}.brand small{display:block;color:#647b80;font-size:11px;margin-top:4px}.connection{margin-left:auto;max-width:116px;text-align:right;color:#28796a;font-size:11px;line-height:1.5}.connection.offline{color:#a33c3c}h1{font-size:30px;letter-spacing:-1px;line-height:1.25;margin:32px 0 8px}.intro{font-size:14px;line-height:1.65;color:#647b80;margin:0 0 23px}.search{display:flex;padding:6px;gap:6px;background:white;border:1px solid #d2e2e1;border-radius:18px;box-shadow:0 6px 22px #143e4e06}.search:focus-within{border-color:#00889e;box-shadow:0 0 0 3px #00889e15}.search input{min-width:0;width:100%;border:0;outline:none;background:transparent;padding:10px;font-size:17px;color:#16343c}.search button{flex:none;min-width:68px;min-height:48px;border:0;border-radius:12px;background:#006f83;color:white;font-weight:650;font-size:15px}.message{font-size:13px;line-height:1.65;color:#607c82;margin:12px 2px;min-height:22px}.message.error{color:#a13a40}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-head h2{font-size:18px;margin:0}.section-head span{color:#6d858a;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.movie{display:block;width:100%;padding:0;border:0;text-align:left;background:transparent;color:inherit;min-width:0}.poster{position:relative;width:100%;aspect-ratio:2/3;background:#dce9e8;border-radius:15px;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover}.poster img.failed{display:none}.poster .fallback{display:none;padding:22px;font-size:16px;line-height:1.6}.poster:has(img.failed) .fallback{display:block}.poster .badge{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:#16343ce8;color:white;padding:5px 8px;border-radius:6px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.movie h3{font-size:15px;line-height:1.5;margin:10px 0 4px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.movie p{font-size:12px;line-height:1.5;color:#71878c;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:44px 22px;text-align:center;background:#ffffff80;border:1px solid #dce8e7;border-radius:22px;margin-top:26px}.empty img{width:94px;height:94px;border-radius:28px;margin-bottom:14px}.empty h2{font-size:18px;margin:0 0 8px}.empty p{font-size:13px;line-height:1.75;color:#71878c;margin:0}.note{text-align:center;font-size:11px;color:#84979a;line-height:1.7;margin-top:30px}.player{position:fixed;z-index:4;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:576px;margin:auto;padding:16px 18px 13px;background:#123e47;color:white;border:1px solid #345c64;border-radius:22px;box-shadow:0 12px 40px #10353e30}.now{display:flex;align-items:center;gap:14px}.now-info{flex:1;min-width:0}.eyebrow{font-size:10px;letter-spacing:1px;color:#9bd3d1;margin-bottom:5px}.now h2{font-size:15px;line-height:1.4;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.now p{font-size:11px;line-height:1.5;color:#bed4d8;margin:4px 0 0}.toggle{flex:none;min-width:64px;min-height:48px;padding:10px;border:0;border-radius:14px;background:#d0f5ee;color:#123e47;font-size:14px;font-weight:750}.seek{width:100%;height:36px;margin:6px 0 0;accent-color:#a3e4d9;cursor:pointer;touch-action:pan-y}.times{display:flex;justify-content:space-between;font-size:11px;color:#bed4d8;font-variant-numeric:tabular-nums}.remote-error{font-size:12px;line-height:1.5;color:#ffd2bd;margin:10px 0 0}.overlay{position:fixed;inset:0;z-index:8;background:#092d3d77;display:flex;align-items:flex-end;justify-content:center;padding-top:40px}.sheet{background:#f7fbfa;border-radius:26px 26px 0 0;width:100%;max-width:600px;max-height:85svh;overflow:auto;padding:24px 20px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px #143e4e18}.sheet-head{display:flex;align-items:flex-start;gap:16px}.sheet-head h2{font-size:20px;line-height:1.4;margin:0;flex:1;overflow-wrap:anywhere}.close{border:1px solid #cbdedc;border-radius:12px;background:white;color:#44646b;min-width:60px;min-height:44px;font-size:13px}.sheet p{font-size:13px;color:#71878c;line-height:1.7}.episodes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.episodes button{border:1px solid #d0e1de;border-radius:12px;background:white;color:#16343c;min-height:48px;padding:12px 6px;font-size:13px;overflow-wrap:anywhere}.episodes button:active{background:#d9eee9}[hidden]{display:none!important}@media(min-width:520px){main{padding-top:32px}.grid{gap:26px 20px}.poster{aspect-ratio:3/4}h1{font-size:36px}}@media(max-width:340px){main{padding-left:14px;padding-right:14px}.brand small{font-size:10px}.connection{max-width:85px}.player{left:8px;right:8px;padding:14px}.episodes{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,opacity .15s}.movie:active{opacity:.7}}
</style></head><body><main>
<header class="brand"><img src="/icon.png?token=__TOKEN__" alt="抱着电视的兔子"><div><strong>LibreTV</strong><small>手机选好片 · 大屏看故事</small></div><span id="connection" class="connection" role="status">正在连接电视…</span></header>
<h1>今晚，看点什么？</h1><p class="intro">在这里找故事，轻轻一点，电视开播。</p>
<form id="search" class="search"><input id="query" aria-label="搜索影片名称" placeholder="搜索影片、动画、剧集" maxlength="100" autocomplete="off" enterkeyhint="search" required><button id="searchButton" type="submit">搜索</button></form>
<p id="message" class="message" role="status" aria-live="polite">手机与电视需保持在同一局域网。</p>
<section id="resultSection" hidden><div class="section-head"><h2>找到这些故事</h2><span id="count"></span></div><div id="results" class="grid"></div></section>
<section id="empty" class="empty"><img src="/icon.png?token=__TOKEN__" alt=""><h2 id="emptyTitle">把喜欢的故事，送上大屏</h2><p id="emptyText">搜索片名后，在手机上挑选。<br>播放时，这里就是你的电视遥控器。</p></section>
<p class="note">直连家里的电视 · 无需安装应用<br>退出电视应用后，重新扫码即可连接。</p>
</main>
<section id="player" class="player" aria-label="电视播放控制" hidden><div class="now"><div class="now-info"><div class="eyebrow">正在电视上播放</div><h2 id="playingTitle"></h2><p id="playingStatus"></p></div><button id="toggle" class="toggle" type="button" disabled>暂停</button></div><input id="seek" class="seek" type="range" min="0" max="1" step="1000" value="0" aria-label="电视播放进度" disabled><div class="times"><span id="position">00:00</span><span id="duration">00:00</span></div><p id="remoteError" class="remote-error" role="status" hidden></p></section>
<div id="overlay" class="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="sheet-head"><h2 id="detailTitle"></h2><button id="close" class="close" type="button">关闭</button></div><p id="detailStatus" role="status"></p><div id="episodes" class="episodes"></div></section></div>
<script nonce="__TOKEN__">
const $=id=>document.getElementById(id),token='__TOKEN__';let state=null,connected=false,polling=false,pollTimer,revision=0,commandPending=false,dragId=null,searching=false,selected=null,lastCard=null;
async function api(path,data,timeout=40000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const response=await fetch(path+'?token='+token,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,signal:controller.signal,cache:'no-store'});if(!response.ok)throw new Error(await response.text());return await response.json()}catch(e){if(e.name==='AbortError'||e.name==='TypeError')throw new Error('连接中断或电视未响应，请检查网络；退出应用后需重新扫码。');throw e}finally{clearTimeout(timer)}}
function message(text,error=false){$('message').textContent=text;$('message').className='message'+(error?' error':'')}
function time(ms){const seconds=Math.floor(Math.max(0,ms)/1000);return (seconds>=3600?Math.floor(seconds/3600)+':':'')+String(Math.floor(seconds/60)%60).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function connection(ok){connected=ok;if(!ok)dragId=null;$('connection').textContent=ok?'已连接家中电视':'连接已断开\n请检查电视';$('connection').className='connection'+(ok?'':' offline');controls()}
function controls(){$('toggle').disabled=!connected||commandPending||!state?.active||!!state?.error;$('seek').disabled=!connected||commandPending||!state?.seekable||!!state?.error}
function renderState(next){if(dragId&&dragId!==next.mediaId){dragId=null;remoteError('电视已切换影片，请重新调整进度。')}state=next;$('player').hidden=!next.active;if(!next.active){dragId=null;return}$('playingTitle').textContent=next.title;$('playingStatus').textContent=next.error||[next.source,'第 '+next.episode+' 集',next.buffering?'正在缓冲':next.paused?'已暂停':'播放中'].filter(Boolean).join(' · ');$('toggle').textContent=next.paused?'播放':'暂停';$('duration').textContent=time(next.duration);if(!dragId){$('seek').max=Math.max(1,next.duration);$('seek').value=next.position;$('position').textContent=time(next.position)}controls()}
function remoteError(text){$('remoteError').hidden=!text;$('remoteError').textContent=text}
async function poll(){clearTimeout(pollTimer);if(document.hidden||polling)return;polling=true;const stamp=revision;try{const next=await api('/state',null,5000);connection(true);if(stamp===revision&&!commandPending)renderState(next)}catch(e){connection(false);if(state?.active)remoteError(e.message)}finally{polling=false;if(!document.hidden)pollTimer=setTimeout(poll,1000)}}
document.addEventListener('visibilitychange',()=>{clearTimeout(pollTimer);if(!document.hidden)poll()});
async function command(action,position,mediaId=state?.mediaId){if(commandPending||!connected||!mediaId)return;commandPending=true;revision++;controls();remoteError('');try{const next=await api('/control',{action,mediaId,...(position===undefined?{}:{position})},6000);dragId=null;renderState(next)}catch(e){dragId=null;remoteError(e.message)}finally{commandPending=false;controls();poll()}}
$('toggle').onclick=()=>command(state.paused?'play':'pause');$('seek').addEventListener('input',()=>{dragId??=state?.mediaId;$('position').textContent=time(Number($('seek').value))});$('seek').addEventListener('change',()=>{const id=dragId;command('seek',Number($('seek').value),id)});$('seek').addEventListener('pointercancel',()=>{dragId=null;if(state)renderState(state)});
$('search').onsubmit=async e=>{e.preventDefault();if(searching)return;const query=$('query').value.trim();if(!query)return;searching=true;$('searchButton').disabled=true;$('searchButton').textContent='搜索中';$('query').blur();message('正在搜索各个视频源…');try{const data=await api('/search',{query});$('results').replaceChildren();for(const item of data.items){const card=document.createElement('button');card.type='button';card.className='movie';const poster=document.createElement('div');poster.className='poster';const img=document.createElement('img');img.alt=item.title;img.loading='lazy';img.decoding='async';img.src=item.cover||'/icon.png?token='+token;img.onerror=()=>{img.className='failed'};const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=item.title;const badge=document.createElement('span');badge.className='badge';badge.textContent=item.remarks||'点选播放';poster.append(img,fallback,badge);const title=document.createElement('h3');title.textContent=item.title;const source=document.createElement('p');source.textContent=item.source;card.append(poster,title,source);card.onclick=()=>openDetail(item,card);$('results').append(card)}$('count').textContent=data.items.length+' 个结果';$('resultSection').hidden=!data.items.length;$('empty').hidden=!!data.items.length;$('emptyTitle').textContent='还没有找到这部影片';$('emptyText').textContent='试试完整片名或更短的关键词。';message(data.failed?data.failed+' 个来源暂时未响应，已显示可用结果。':data.items.length?'点击影片，在电视上播放。':'没有搜索结果。',!!data.failed)}catch(e){message(e.message,true)}finally{searching=false;$('searchButton').disabled=false;$('searchButton').textContent='搜索'}};
function closeSheet(){$('overlay').hidden=true;selected=null;document.body.style.overflow='';lastCard?.focus()}
$('close').onclick=closeSheet;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeSheet()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){const items=[...$('overlay').querySelectorAll('button:not(:disabled)')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
async function openDetail(item,card){selected=item;lastCard=card;$('detailTitle').textContent=item.title;$('detailStatus').textContent='正在读取剧集…';$('episodes').replaceChildren();$('overlay').hidden=false;document.body.style.overflow='hidden';$('close').focus();try{const detail=await api('/detail',{id:item.id});if(selected!==item)return;$('detailStatus').textContent=detail.source+' · '+detail.episodes.length+' 集，选择后在电视播放';for(const [index,label] of detail.episodes.entries()){const button=document.createElement('button');button.textContent=label;button.type='button';button.onclick=()=>play(item,index);$('episodes').append(button)}if(detail.episodes.length===1)await play(item,0)}catch(e){if(selected===item)$('detailStatus').textContent=e.message}}
async function play(item,episode){$('episodes').querySelectorAll('button').forEach(b=>b.disabled=true);$('detailStatus').textContent='正在电视上打开…';try{await api('/play',{id:item.id,episode},6000);if(selected===item)closeSheet();message('已请求电视播放 '+item.title+'，播放状态见下方。');poll()}catch(e){if(selected===item)$('detailStatus').textContent=e.message;else message(e.message,true)}finally{$('episodes').querySelectorAll('button').forEach(b=>b.disabled=false)}}
poll();
</script></body></html>
