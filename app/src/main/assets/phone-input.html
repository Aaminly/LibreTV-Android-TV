<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>LibreTV · 手机输入</title><link rel="icon" href="/icon.png?token=__TOKEN__" type="image/png"><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f5;color:#122a38;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;padding:28px 22px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center}main{width:100%;max-width:420px}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:750}.brand img{width:52px;height:52px;border-radius:17px}.brand small{display:block;font-size:12px;font-weight:500;color:#607782;margin-top:4px}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #c5ded9;border-radius:30px;padding:7px 11px;font-size:12px;color:#27675b;margin:32px 0 14px}.dot{width:6px;height:6px;border-radius:50%;background:#268572}h1{font-size:32px;line-height:1.22;letter-spacing:-1px;margin:0 0 12px}p{color:#5f7480;font-size:15px;line-height:1.7;margin:0}form{background:white;border:1px solid #dce8e9;border-radius:24px;padding:24px;margin-top:28px;box-shadow:0 16px 40px #22474c08}label{display:block;font-size:15px;font-weight:650;margin-bottom:12px}input{width:100%;min-width:0;padding:16px 14px;font:inherit;font-size:20px;line-height:1.4;color:#142d3b;border:1.5px solid #c2d7db;border-radius:12px;background:#fafdfd;outline:none}input:focus{border-color:#00889e;box-shadow:0 0 0 3px #00889e20}.count{text-align:right;font-size:12px;color:#748891;margin:8px 0 20px}button{width:100%;border:0;border-radius:12px;background:#006f83;color:white;font:inherit;font-weight:650;font-size:17px;line-height:1.4;padding:17px 12px;min-height:56px;cursor:pointer}button:focus-visible{outline:3px solid #143e4e;outline-offset:4px}button:disabled{opacity:.65;cursor:default}#status{min-height:24px;margin-top:16px;font-size:14px;line-height:1.6}#status.error{color:#a33038}#status.success{color:#1c7160}.hint{display:flex;gap:12px;margin-top:26px;padding:0 4px}.number{flex:none;background:#dbeae9;color:#357164;border-radius:50%;width:24px;height:24px;text-align:center;font-size:12px;line-height:24px}.hint p{font-size:13px}.footer{font-size:12px;color:#74858c;margin-top:36px;text-align:center}@media(max-height:650px){body{padding-top:20px}.badge{margin-top:20px}form{margin-top:20px}.footer{margin-top:22px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}button:active{background:#00596b}}
</style></head><body><main><div class="brand"><img src="/icon.png?token=__TOKEN__" alt="抱着小电视的兔子"><div>LibreTV<small>大屏好故事 · 手机轻松搜</small></div></div><div class="badge"><span class="dot"></span>电视专属输入页</div><h1>想看什么？<br>在手机上告诉电视。</h1><p>输入影片名称，精彩故事即刻在大屏展开。</p><form id="form"><label for="query">影片名称</label><input id="query" name="query" placeholder="例如：疯狂动物城" maxlength="100" autocomplete="off" enterkeyhint="search" required aria-describedby="status"><div class="count"><span id="count">0</span> / 100</div><button id="send" type="submit">在电视上搜索 →</button><p id="status" role="status" aria-live="polite">提交后，电视会自动进入搜索页。</p></form><div class="hint"><span class="number">✓</span><p>手机和电视需要连接同一局域网。<br>请保持电视上的二维码面板打开。</p></div><p class="footer">手机直连电视 · 无需安装应用</p></main><script nonce="__TOKEN__">
const form=document.getElementById('form'),input=document.getElementById('query'),button=document.getElementById('send'),status=document.getElementById('status');let pending=false;
input.addEventListener('input',()=>document.getElementById('count').textContent=input.value.length);
form.addEventListener('submit',async e=>{e.preventDefault();if(pending)return;const query=input.value.trim();if(!query){status.textContent='请先输入影片名称';status.className='error';input.focus();return}pending=true;button.disabled=true;button.textContent='正在发送…';status.className='';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch('/search?token=__TOKEN__',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({query}).toString(),signal:controller.signal});const message=await response.text();if(!response.ok)throw new Error(message);status.textContent=message+'，请看大屏。';status.className='success';button.textContent='已发送到电视 ✓';input.disabled=true;}catch(error){status.className='error';status.textContent=error.name==='TypeError'||error.name==='AbortError'?'连接已结束或网络不可达。请查看电视搜索页；若未收到，请重新打开扫码输入。':error.message;button.disabled=false;button.textContent='重新发送 →';pending=false;}finally{clearTimeout(timer)}});
</script></body></html>
